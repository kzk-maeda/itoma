<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow">
  <title>いとま — 5つの配色を比べる</title>
  <style>
    :root { color-scheme:light; --bg:#f6f5f0; --text:#263d33; --muted:#626b63; --line:#dbe1d8; }
    * { box-sizing:border-box; } body { margin:0; background:var(--bg); color:var(--text); font:14px/1.8 -apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",sans-serif; }
    main { max-width:1850px; margin:auto; padding:34px; } header { display:flex; justify-content:space-between; align-items:center; gap:20px; border-bottom:1px solid var(--line); padding-bottom:23px; }
    .eyebrow { color:var(--muted); font-size:11px; letter-spacing:.14em; } h1 { font-size:29px; font-weight:500; margin:6px 0; } p { margin:0; color:var(--muted); font-size:12px; }
    .switch { display:flex; gap:6px; } button,a { min-height:44px; } button { color:inherit; font:inherit; cursor:pointer; border:1px solid var(--line); border-radius:30px; padding:8px 17px; background:transparent; }
    button[aria-pressed=true] { background:var(--text); color:var(--bg); border-color:var(--text); } a { color:var(--text); text-underline-offset:5px; display:inline-flex; align-items:center; font-size:12px; }
    :focus-visible { outline:3px solid var(--text); outline-offset:3px; } .grid { display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:20px; margin-top:28px; }
    article { min-width:0; } h2 { font-size:17px; font-weight:500; margin:5px 0; } .number { color:var(--muted); font-size:12px; } article>p { min-height:40px; } iframe { display:block; width:100%; height:850px; border:0; margin-top:14px; background:transparent; }
    footer { border-top:1px solid var(--line); margin-top:24px; padding-top:20px; color:var(--muted); font-size:11px; }
    @media(max-width:1350px) { .grid { grid-template-columns:repeat(3,minmax(0,1fr)); } }
    @media(max-width:850px) { main { padding:22px; } .grid { grid-template-columns:repeat(2,minmax(0,1fr)); } header { display:block; } .switch { margin-top:18px; } }
    @media(max-width:580px) { .grid { grid-template-columns:1fr; max-width:390px; margin-inline:auto; } h1 { font-size:25px; } }
    body[data-appearance=dark] { color-scheme:dark; --bg:#191c1a; --text:#edf1e7; --muted:#b5c0b4; --line:#465347; }
  </style>
</head>
<body>
  <main>
    <header><div><span class="eyebrow">ITOMA / COLOR STUDY</span><h1>余白の、5つの色。</h1><p>同じ画面、同じ体験。背景・文字・円・アクセントを一組で比べる。</p></div><div class="switch" aria-label="表示モード"><button data-mode="light" aria-pressed="true">ライト</button><button data-mode="dark" aria-pressed="false">ダーク</button></div></header>
    <div class="grid" id="grid"></div>
    <footer>比較用Webデモ · 実際のアプリ制限は行いません。理由は保存・送信されません。各案のリンクから操作デモを開けます。</footer>
  </main>
  <script src="color-palettes.js"></script>
  <script>
    const palettes = window.itomaColorPalettes;
    let mode = 'light';
    document.querySelector('#grid').innerHTML = palettes.map((palette,index) => `<article><span class="number">0${index+1}</span><h2>${palette.name}</h2><p>${palette.mood}</p><a href="design-colors.html?palette=${palette.id}&appearance=light" data-demo="${palette.id}">この配色で操作する ↗</a><iframe title="${palette.name}のホーム画面" src="design-colors.html?palette=${palette.id}&appearance=light&preview=1"></iframe></article>`).join('');
    function sync(frame) { frame.contentWindow.itomaSetAppearance?.(mode); }
    document.querySelectorAll('iframe').forEach(frame => frame.addEventListener('load',()=>sync(frame)));
    document.addEventListener('click',event => {
      const button = event.target.closest('[data-mode]'); if (!button) return;
      mode = button.dataset.mode; document.body.dataset.appearance = mode;
      document.querySelectorAll('[data-mode]').forEach(item=>item.setAttribute('aria-pressed',String(item===button)));
      document.querySelectorAll('iframe').forEach(sync);
      document.querySelectorAll('[data-demo]').forEach(link=>link.href=`design-colors.html?palette=${link.dataset.demo}&appearance=${mode}`);
    });
  </script>
</body>
</html>
