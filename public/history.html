<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow"><meta name="color-scheme" content="light dark">
  <title>いとま — 時間のあとに、残るもの。</title>
  <link rel="stylesheet" href="history.css"><script type="module" src="history.mjs"></script>
</head>
<body>
<header class="site-header"><a class="brand" href="#home" aria-label="いとま ホーム"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M21 4.8a12 12 0 1 0 6.2 6.2"/></svg><span>いとま</span></a><span class="study-label">DESIGN STUDY · HISTORY</span></header>
<main class="workbench">
  <aside class="study-controls">
    <p class="eyebrow">時間の、その先を考える</p><h1>時間のあとに、<br>残るもの。</h1>
    <p class="intro">積み重ねた時間も、選び直した理由も。<br>いとまらしい「振り返り」を、5つの形で。</p>
    <div id="ideas" class="ideas" role="group" aria-label="振り返りの5案を比較"></div>
    <div class="study-description" aria-live="polite"><p id="idea-question"></p><p id="idea-description"></p><dl><dt>向いていること</dt><dd id="idea-strength"></dd><dt>検討したいこと</dt><dd id="idea-tradeoff"></dd></dl></div>
    <div class="demo-options"><button id="try-home" class="text-button">ホームから試す <span aria-hidden="true">↗</span></button>
      <label>外観<select id="appearance"><option value="system">端末に合わせる</option><option value="light">ライト</option><option value="dark">ダーク</option></select></label>
      <label>履歴の状態<select id="scenario"><option value="normal">サンプルあり</option><option value="empty">記録なし</option><option value="incomplete">一部の記録が不明</option><option value="error">読み込みに失敗</option></select></label>
      <p class="demo-note">Webモック · すべて架空の記録です。比較期間は10/26〜11/1。メモ・解除操作は端末へ保存・送信せず、再読込で初期化します。OS制限・実利用時間の取得は行いません。</p>
    </div>
  </aside>
  <section class="preview" aria-label="操作できるアプリのモック">
    <div class="phone">
      <div class="statusbar" aria-hidden="true"><span>21:30</span><span>●●● ▰</span></div>
      <div class="app-scroll" id="app-scroll"><div id="screen"></div></div>
      <nav class="tabbar" aria-label="アプリ内ナビゲーション"><a href="#home" id="home-tab"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 10 9-7 9 7v10H6V10m3 10v-7h6v7"/></svg>ホーム</a><a href="#history/calendar" id="history-tab"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14v17H5zM9 1v6m6-6v6M5 10h14m-10 4h2m3 0h2m-7 3h2"/></svg>振り返り</a></nav>
      <div class="home-indicator" aria-hidden="true"></div>
    </div>
    <p class="preview-caption">ホームの「振り返り」から各案へ。外側の番号で切り替えられます。</p>
  </section>
</main>
<dialog id="sheet" aria-labelledby="sheet-title"><div id="sheet-body"></div><button class="secondary wide" id="sheet-close">閉じる</button></dialog>
<div id="announcement" class="sr-only" role="status"></div>
</body></html>
