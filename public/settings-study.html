<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="light dark"><meta name="robots" content="noindex,nofollow"><title>設定の見直し | いとま demo</title><link rel="stylesheet" href="settings.css"></head>
<body><div class="study"><aside class="study-info"><a class="wordmark" href="#settings"><span class="open-circle" aria-hidden="true"></span>いとま <small>DESIGN STUDY</small></a><h1>設定を、<br>迷わない入口に。</h1><p>変えたいことから選び、<br>影響を確かめて決める。</p><div class="study-points"><p><b>01</b> 一覧は短く、今の状態を添える</p><p><b>02</b> スケジュールの操作は詳細へ</p><p><b>03</b> 削除するもの・残るものを示す</p></div><details class="controls" open><summary>デモの確認条件</summary><label>開始状態<select id="scenario"><option value="normal">通常・スケジュール2件</option><option value="many">スケジュール8件</option><option value="empty">設定・記録なし</option><option value="paused">すべて停止中</option><option value="denied">スクリーンタイム未許可</option><option value="review">再許可後・対象の再選択が必要</option><option value="unknown">反映状態が不明</option><option value="gap">記録の取込が必要</option></select></label><label>次の操作結果<select id="outcome"><option value="ok">成功のモック</option><option value="error">失敗のモック</option><option value="unknown">結果不明のモック</option></select></label><label>画面の明るさ<select id="appearance"><option value="system">端末に合わせる</option><option value="light">ライト</option><option value="dark">ダーク</option></select></label><label>文字サイズ<select id="text-size"><option value="1">標準</option><option value="1.5">150%</option><option value="2">200%</option></select></label></details><p class="disclaimer">操作できる画面モックです。アプリ名・記録は架空で、OSの許可・制限・保存・削除は行いません。変更は再読込で初期化されます。</p><a href="settings-review.html" class="review-link">現行mainのUXレビューを読む ↗</a></aside><div class="device-wrap"><div class="preview-label">改善案 · キャラクターなし</div><div class="device"><div class="statusbar" aria-hidden="true"><span>21:30</span><span>◔ ▰</span></div><div id="app"></div></div></div></div><dialog id="dialog" aria-labelledby="dialog-title"><div id="dialog-body"></div></dialog><script type="module" src="settings.mjs"></script></body></html>
