<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>いとま — 3つのデザイン体験</title>
  <style>
    :root{color-scheme:light;--bg:#f6f5f0;--surface:#fff;--ink:#263d33;--muted:#626b63;--line:#dbe1d8;--accent:#355c49;--soft:#e8ede4;--on:#fff}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;font-size:14px;line-height:1.7}button,input,textarea{font:inherit}button{cursor:pointer;color:inherit}button:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:4px}button:disabled{cursor:default;opacity:.55}button,a,textarea{-webkit-tap-highlight-color:transparent}button{min-height:44px}header,main,footer{max-width:1320px;margin:auto;padding-inline:44px}.top{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-block:20px}.wordmark{display:flex;gap:10px;align-items:center;font-weight:600;font-size:19px;letter-spacing:.1em}.mark{width:31px;height:31px;border:1.5px solid var(--accent);border-radius:50% 50% 50% 5px;display:inline-flex;justify-content:center;align-items:center;font-size:18px;line-height:1}.eyebrow{font-size:11px;letter-spacing:.15em;font-weight:600;color:var(--muted)}.intro{padding-block:42px 30px;display:flex;justify-content:space-between;gap:24px;align-items:end}h1{font-size:32px;line-height:1.5;font-weight:500;letter-spacing:.04em;margin:9px 0}p{margin:0}.muted{color:var(--muted)}.intro p{max-width:440px}.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:26px}.toolbar span{font-size:12px;color:var(--muted);margin-right:8px}.chip{border:1px solid var(--line);background:transparent;border-radius:30px;padding:8px 16px;font-size:12px}.chip[aria-pressed=true]{background:var(--accent);color:var(--on);border-color:var(--accent)}.chip:last-child{margin-left:auto}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:28px}.concept{display:flex;flex-direction:column;min-width:0}.concept-head{display:flex;gap:12px;margin-bottom:18px;align-items:start}.letter{border-top:2px solid var(--accent);padding-top:5px;font-size:20px;width:30px;flex:none}.concept h2{font-size:18px;margin:1px 0 3px;font-weight:500}.concept-head p{font-size:12px;color:var(--muted)}.phone{border:1px solid var(--line);border-radius:30px;background:var(--surface);overflow:hidden;box-shadow:0 9px 25px #263d3306;min-height:710px;display:flex;flex-direction:column}.phone-top{display:flex;justify-content:space-between;padding:17px 24px 0;font-size:11px;font-weight:600}.phone-top span:last-child{letter-spacing:2px}.app-head{display:flex;justify-content:space-between;align-items:center;padding:24px 24px 0}.app-head .wordmark{font-size:17px}.app-head .mark{width:27px;height:27px;font-size:15px}.app-head small{color:var(--muted);font-size:11px}.screen{padding:28px 24px 24px;flex:1;display:flex;flex-direction:column;min-height:608px}.screen h3{font-size:27px;line-height:1.55;font-weight:500;letter-spacing:.02em;margin:10px 0 14px}.status{font-size:11px;display:inline-flex;gap:7px;align-items:center;font-weight:600;letter-spacing:.06em}.status::before{content:'●';font-size:9px}.rule{margin:21px 0;border-block:1px solid var(--line);padding:15px 0}.row{display:flex;justify-content:space-between;align-items:center;gap:12px}.row+.row{margin-top:14px}.app{display:flex;gap:10px;align-items:center}.app-icon{width:30px;height:30px;background:var(--ink);color:var(--bg);border-radius:9px;display:inline-flex;align-items:center;justify-content:center;font-weight:600;font-size:14px}.app-icon.youtube{background:var(--soft);color:var(--ink);font-size:12px}.rule small{font-size:11px;color:var(--muted)}.primary,.secondary{display:block;width:100%;padding:12px 14px;border-radius:13px;font-weight:500;font-size:13px;min-height:49px}.primary{border:1px solid var(--accent);background:var(--accent);color:var(--on)}.secondary{border:1px solid var(--line);background:transparent}.primary+.secondary,.secondary+.primary{margin-top:9px}.push{margin-top:auto;padding-top:25px}.caption{font-size:11px;color:var(--muted);margin-top:11px;line-height:1.8}.footnote{font-size:11px;color:var(--muted);margin-top:17px}.nav{display:flex;justify-content:space-around;padding:14px 10px 18px;border-top:1px solid var(--line);font-size:11px;color:var(--muted)}.nav strong{color:var(--ink);font-weight:600}.orb{width:150px;height:150px;margin:8px auto 29px;border-radius:50%;border:1px solid var(--line);display:grid;place-content:center;text-align:center;position:relative}.orb:before{content:'';position:absolute;inset:12px;border:1px solid var(--line);border-radius:50%}.orb b{font-size:31px;font-weight:400;line-height:1.3}.orb small{font-size:10px;color:var(--muted);margin-top:7px}.paper{background:var(--bg)}.book{width:58px;height:44px;border:1px solid var(--accent);border-radius:3px 12px 12px 3px;margin-bottom:24px;position:relative}.book:after{content:'';position:absolute;left:10px;top:0;height:100%;border-left:1px solid var(--accent)}.quote{border-left:2px solid var(--accent);padding:2px 0 2px 16px;margin:18px 0}.quote p{font-size:20px;line-height:1.8}.timebar{height:5px;background:var(--line);border-radius:4px;margin:12px 0 6px}.timebar i{display:block;width:25%;height:100%;background:var(--accent);border-radius:4px}.schedule{margin:12px 0 24px;border-left:1px solid var(--line);padding-left:18px}.schedule div{position:relative;padding:12px 0}.schedule div:before{content:'○';position:absolute;left:-25px;background:var(--surface);font-size:12px}.schedule div:first-child:before{content:'●';color:var(--accent)}.schedule b{font-size:12px;font-weight:500}.schedule p{font-size:12px;color:var(--muted);margin-top:5px}.reason{display:flex;justify-content:space-between;align-items:center;text-align:left;width:100%;border:1px solid var(--line);border-radius:12px;background:transparent;padding:10px 14px;margin-top:8px;font-size:13px}.reason[aria-checked=true]{border-color:var(--accent);background:var(--soft)}.reason span{font-size:16px}.summary{background:var(--soft);border-radius:12px;padding:14px;margin-top:18px;font-size:12px}.summary strong{display:block;font-size:14px;margin-bottom:4px;font-weight:500}textarea{display:block;width:100%;resize:vertical;min-height:110px;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);margin-top:10px}label{font-size:12px}.back{align-self:flex-start;display:block;background:none;border:0;padding:0;font-size:12px;color:var(--muted);margin:-9px 0 14px}.result{font-size:12px;background:var(--soft);border-radius:8px;padding:10px 12px;margin-top:15px}.design-note{padding:19px 2px 0;font-size:12px;color:var(--muted)}.design-note b{display:block;color:var(--ink);font-weight:500;margin-bottom:5px}.bottom{display:flex;justify-content:space-between;gap:20px;border-top:1px solid var(--line);margin-top:38px;padding-block:22px 32px;font-size:11px;color:var(--muted)}.demo-controls{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}.demo-controls button{background:transparent;border:0;text-decoration:underline;text-underline-offset:4px;color:var(--muted);font-size:11px;padding:0 4px}.warning{border:1px solid var(--line);padding:16px;border-radius:12px;margin-top:20px}.warning h4{font-size:15px;margin:0 0 8px}.empty{height:16px}[hidden]{display:none!important}
    @media(min-width:1000px){.concept:nth-child(2){padding-top:0}.screen{min-height:622px}}
    @media(max-width:950px){header,main,footer{padding-inline:24px}.grid{gap:16px}.screen{padding-inline:18px}.app-head{padding-inline:18px}.intro{display:block}.intro p{margin-top:16px}.screen h3{font-size:24px}}
    @media(max-width:760px){header,main,footer{padding-inline:20px}.top{padding-block:15px}.top>.eyebrow{font-size:9px}.intro{padding-top:28px}h1{font-size:27px}.grid{grid-template-columns:1fr;gap:32px;max-width:420px;margin:auto}.phone{min-height:690px}.screen{padding-inline:25px;min-height:590px}.app-head{padding-inline:25px}.toolbar{gap:6px}.chip{padding:8px 12px}.chip:last-child{margin-left:0}.toolbar>span{width:100%}.bottom{display:block}.bottom p+p{margin-top:10px}}
    @media(prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#171e1a;--surface:#242e27;--ink:#edf1e7;--muted:#b5c0b4;--line:#465347;--accent:#bed1b8;--soft:#303f33;--on:#1a2c20}}
    @media(prefers-reduced-motion:no-preference){button{transition:background-color .16s,border-color .16s}button:hover:not(:disabled){filter:brightness(.94)}}
  </style>
</head>
<body>
<header><div class="top"><div class="wordmark"><span class="mark" aria-hidden="true">い</span>いとま</div><span class="eyebrow">DESIGN STUDY / 01—03</span></div></header>
<main>
  <div class="intro"><div><span class="eyebrow">自分で決めた時間に、戻る。</span><h1>いとまの、3つのかたち。</h1><p class="caption">操作できる比較デモ · 実際のアプリ制限は行いません</p></div><p class="muted">穏やかな伝え方と、意思を確かめるひと呼吸。<br>同じ夜の場面を、3つの体験で比べてみてください。</p></div>
  <div class="toolbar" aria-label="デモの表示切り替え"><span>体験する画面</span><button class="chip" data-stage="home" aria-pressed="true">ホーム</button><button class="chip" data-stage="intent" aria-pressed="false">一時解除</button><button class="chip" data-stage="active" aria-pressed="false">解除中</button><button class="chip" id="reset">はじめから ↺</button></div>
  <div class="grid" id="concepts"></div>
</main>
<footer><div class="bottom"><p>比較用プロトタイプ · 表示時刻 21:30 · 一時解除 5分（仮値）</p><p>実際のアプリ制限・アプリ起動・請求は行いません。入力内容は保存・送信されません。</p></div></footer>
<script>
  'use strict';
  const studies = [
    {id:'a',letter:'A',title:'静かな明快さ',subtitle:'状態を先に。少ない操作で、自分の時間へ。',method:'目的を選ぶ',note:'状態 → 対象 → 次の操作の順で整理。目的を選択し、解除内容を確認します。'},
    {id:'b',letter:'B',title:'余白のある伴走',subtitle:'大切にしたいことを、そっと思い出す。',method:'問いかけを読んで確認する',note:'本人が登録した「読書」を中心に。入力を求めず、問いと確認の2段階でひと呼吸置きます。'},
    {id:'c',letter:'C',title:'意思をことばに',subtitle:'自分の言葉で決める、短い約束。',method:'利用目的を短く書く',note:'時間の流れとルールを明示。目的を自分の言葉で書き、解除前に確認します。'}
  ];
  const state = Object.fromEntries(studies.map(s=>[s.id,{stage:'home',purpose:'',notice:'',until:0}]));
  const escapeHtml = value => value.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  function button(label,action,primary=false,disabled=false){return `<button class="${primary?'primary':'secondary'}" data-action="${action}" ${disabled?'disabled':''}>${label}</button>`;}
  function apps(active=false){return `<div class="rule"><div class="row"><div class="app"><span class="app-icon" aria-hidden="true">X</span><span>X</span></div><small>${active?'一時解除中':'23:00まで制限'}</small></div><div class="row"><div class="app"><span class="app-icon youtube" aria-hidden="true">▶</span><span>YouTube</span></div><small>23:00まで制限</small></div></div>`;}
  function summary(){return '<div class="summary"><strong>Xだけを、5分間。</strong>YouTubeの制限は続きます。<br>確定すると5分が始まり、終了後は制限に戻ります。</div>';}
  function home(s,t){
    const notice=t.notice?`<p class="result" role="status">${t.notice}</p>`:'';
    let content='';
    if(s.id==='a') content=`<span class="status">夜の時間・制限中</span><h3>23:00まで、<br>自分の時間。</h3><p class="muted">あなたが選んだ夜のルールです。</p>${apps()}<p class="eyebrow">このあとの予定</p><div class="row" style="margin-top:10px"><span>23:00</span><span class="muted">アプリの制限が終了</span></div>`;
    if(s.id==='b') content=`<div class="orb" aria-hidden="true"><b>23:00</b><small>まで、自分の時間</small></div><span class="status">X・YouTubeを制限中</span><div class="quote"><p>夜は、本を読む<br>時間にしたい。</p></div><p class="caption">ルール設定時に、あなたが書いたこと</p><div class="timebar" aria-hidden="true"><i></i></div><div class="row caption"><span>21:00 開始</span><span>23:00 終了</span></div>`;
    if(s.id==='c') content=`<span class="status">夜のルールが適用中</span><h3>今夜の時間の<br>使い方。</h3><div class="schedule"><div><b>21:00 — 23:00　自分の時間</b><p>X・YouTubeを制限<br>一時解除には、目的をひと言。</p></div><div><b>23:00 —　制限なし</b><p>夜のルールが終了します。</p></div></div><p class="eyebrow">あなたが決めたこと</p><p style="margin-top:8px">寝る前に、少し読書をする。</p>`;
    return `${content}${notice}<div class="push">${button('Xを一時解除する','intent',true)}<p class="caption">解除前に、目的と解除する内容を確認します。</p></div>`;
  }
  function intent(s,t){
    let input='';
    if(s.id==='a')input=`<div role="radiogroup" aria-label="Xを開く目的">${['連絡を確認する','調べものをする','休憩する','その他'].map(p=>`<button class="reason" role="radio" aria-checked="${t.purpose===p}" data-purpose="${p}">${p}<span aria-hidden="true">${t.purpose===p?'●':'○'}</span></button>`).join('')}</div>`;
    if(s.id==='b')input='<div class="quote"><p>「夜は、本を読む<br>時間にしたい。」</p></div><p class="muted">その時間から、今はXを使う時間へ。<br>何をするか、思い浮かべてみてください。</p>';
    if(s.id==='c')input=`<label for="purpose-c">今回、Xでしたいこと</label><textarea id="purpose-c" maxlength="120" placeholder="例：友人からの連絡を確認する">${escapeHtml(t.purpose)}</textarea><p class="caption">短いひと言でかまいません。内容の評価はしません。</p>`;
    return `<button class="back" data-action="cancel">‹ ホームに戻る</button><span class="eyebrow">ひと呼吸 / 01</span><h3>いま、何のために<br>Xを開きますか？</h3><p class="muted" style="margin-bottom:20px">Xは、あなたが選んだルールで<br>23:00まで制限されています。</p>${input}<div class="push">${button('制限を続ける','cancel',true)}${button('解除内容を確認する →','confirm',false,s.id!=='b'&&!t.purpose.trim())}</div>`;
  }
  function confirm(s,t){return `<button class="back" data-action="intent">‹ 目的の確認に戻る</button><span class="eyebrow">解除する内容 / 02</span><h3>この5分を、<br>何に使うか。</h3><p class="muted">${s.id==='b'?'思い浮かべた目的のために、Xを一時解除します。':'今回の目的'}</p>${s.id!=='b'?`<p style="margin-top:12px;overflow-wrap:anywhere">${escapeHtml(t.purpose)}</p>`:''}${summary()}<p class="caption">夜のルール自体は変更しません。<br>途中でも制限に戻せます。</p><div class="push">${button('制限を続ける','cancel',true)}${button('Xを5分間解除する','unlock')}</div>`;}
  function active(s,t){const remaining=Math.max(0,Math.ceil((t.until-Date.now())/1000));const time=`${Math.floor(remaining/60)}:${String(remaining%60).padStart(2,'0')}`;return `<span class="status">Xを一時解除中</span><h3>選んだ用事に、<br>この時間を。</h3><div class="orb"><b data-countdown="${s.id}">${time}</b><small>一時解除の残り時間</small></div>${apps(true)}<p class="muted">終了後、Xも23:00までの制限に戻ります。</p><div class="push">${button('今すぐ制限に戻す','restore',true)}<p class="caption">このデモでは、Xは実際には開きません。</p></div>`;}
  function error(){return `<span class="status">制限の状態を確認できません</span><h3>今の状態を、<br>確認しましょう。</h3><p class="muted">ルールは設定されていますが、アプリが制限されているか確認できません。</p><div class="warning"><h4>設定と、適用結果は別です。</h4><p class="muted">この表示では「制限中」と断定しません。</p></div><div class="push">${button('状態を再確認する','retry',true)}<p class="caption">デモでは制限中の表示に戻ります。</p></div>`;}
  function render(id){const s=studies.find(s=>s.id===id),t=state[id],screen=document.querySelector(`#screen-${id}`);screen.innerHTML=({home:home,intent:intent,confirm:confirm,active:active,error:error}[t.stage])(s,t);document.querySelector(`#phase-${id}`).textContent=({home:'ホーム',intent:'一時解除',confirm:'解除前の確認',active:'解除中',error:'状態不明'})[t.stage];}
  document.querySelector('#concepts').innerHTML=studies.map(s=>`<section class="concept" data-id="${s.id}" aria-label="${s.letter}案 ${s.title}"><div class="concept-head"><span class="letter">${s.letter}</span><div><h2>${s.title}</h2><p>${s.subtitle}</p></div></div><div class="phone ${s.id==='b'?'paper':''}"><div class="phone-top"><span>21:30</span><span aria-hidden="true">▂ ▄ ▰</span></div><div class="app-head"><div class="wordmark"><span class="mark" aria-hidden="true">い</span>いとま</div><small id="phase-${s.id}">ホーム</small></div><div class="screen" id="screen-${s.id}" aria-label="${s.letter}案の画面"></div><div class="nav"><strong>⌂　ホーム</strong><span>夜の時間 · 21:00–23:00</span></div></div><div class="design-note"><b>${s.letter}案の一拍：${s.method}</b>${s.note}</div><div class="demo-controls" aria-label="${s.letter}案のデモ操作"><button data-action="expire">期限到達を試す</button><button data-action="error">状態不明を試す</button></div></section>`).join('');
  function setStage(id,stage){const t=state[id];t.stage=stage;t.notice='';if(stage==='active')t.until=Date.now()+300000;render(id);}
  function restore(id,notice){state[id]={stage:'home',purpose:'',notice,until:0};render(id);}
  document.addEventListener('click',event=>{
    const stageButton=event.target.closest('[data-stage]');
    if(stageButton){document.querySelectorAll('[data-stage]').forEach(b=>b.setAttribute('aria-pressed',String(b===stageButton)));studies.forEach(s=>{state[s.id].purpose='';setStage(s.id,stageButton.dataset.stage)});return;}
    if(event.target.closest('#reset')){document.querySelector('[data-stage="home"]').click();return;}
    const control=event.target.closest('[data-action],[data-purpose]');if(!control)return;
    const id=control.closest('[data-id]').dataset.id,t=state[id];
    if(control.dataset.purpose){t.purpose=control.dataset.purpose;document.querySelectorAll(`#screen-${id} [data-purpose]`).forEach(b=>{const checked=b.dataset.purpose===t.purpose;b.setAttribute('aria-checked',String(checked));b.querySelector('span').textContent=checked?'●':'○'});document.querySelector(`#screen-${id} [data-action="confirm"]`).disabled=false;return;}
    const action=control.dataset.action;
    if(action==='confirm'&&id!=='b'&&!t.purpose.trim())return;
    if(action==='cancel')restore(id,'制限を続けています。解除は行っていません。');
    else if(action==='restore')restore(id,'一時解除を終了しました。Xも23:00まで制限中です。');
    else if(action==='expire'){if(t.stage==='active')restore(id,'5分間が終了しました。Xも23:00まで制限中です。');else{t.notice='期限到達は「解除中」の画面で試せます。';t.stage='home';render(id);}}
    else if(action==='retry')restore(id,'状態を再確認しました。（デモ上の制限中表示）');
    else setStage(id,action==='unlock'?'active':action);
    document.querySelectorAll('[data-stage]').forEach(b=>b.setAttribute('aria-pressed','false'));
    const first=document.querySelector(`#screen-${id} button`);if(first)first.focus();
  });
  document.addEventListener('input',event=>{if(event.target.id==='purpose-c'){state.c.purpose=event.target.value;document.querySelector('#screen-c [data-action="confirm"]').disabled=!event.target.value.trim();}});
  document.addEventListener('keydown',event=>{if(!event.target.matches('[data-purpose]')||!['ArrowDown','ArrowUp','ArrowLeft','ArrowRight'].includes(event.key))return;event.preventDefault();const options=[...event.target.closest('[role="radiogroup"]').querySelectorAll('[data-purpose]')],direction=['ArrowDown','ArrowRight'].includes(event.key)?1:-1,next=options[(options.indexOf(event.target)+direction+options.length)%options.length];next.focus();next.click();});
  setInterval(()=>studies.forEach(s=>{const t=state[s.id];if(t.stage!=='active')return;const remaining=Math.max(0,Math.ceil((t.until-Date.now())/1000));if(!remaining){restore(s.id,'5分間が終了しました。Xも23:00まで制限中です。');return;}document.querySelector(`[data-countdown="${s.id}"]`).textContent=`${Math.floor(remaining/60)}:${String(remaining%60).padStart(2,'0')}`;}),1000);
  studies.forEach(s=>render(s.id));
</script>
</body>
</html>
