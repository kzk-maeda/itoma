name: Deploy demo

on:
  push:
    branches: ['demo/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    if: >-
      github.ref_type == 'branch' && startsWith(github.ref_name, 'demo/') &&
      github.ref_name != github.event.repository.default_branch && github.event.deleted != true
    # Shared with delete/reconciliation; legacy orphan names have no original ref.
    concurrency:
      group: itoma-demo-resource-mutations
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CF_SEND_TELEMETRY: 'false'

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test -- --ci --runInBand
      - run: npm run test:demo
      - name: Diagnose Expo dependencies
        if: github.ref_name == 'demo/multi-rule-status'
        continue-on-error: true
        run: npx expo-doctor
      - run: npm run demo:package
      - name: Install isolated demo browser tools
        if: github.ref_name == 'demo/multi-rule-status'
        run: |
          npm install --prefix /tmp/itoma-demo-browser --no-save --package-lock=false playwright@1.58.2
          /tmp/itoma-demo-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Verify multi-rule static demo before deployment
        if: github.ref_name == 'demo/multi-rule-status'
        env:
          PLAYWRIGHT_MODULE: /tmp/itoma-demo-browser/node_modules/playwright
        run: node scripts/check-multi-rule-demo.cjs
      - name: Upload synthetic Web UI evidence
        if: always() && github.ref_name == 'demo/multi-rule-status'
        uses: actions/upload-artifact@v6
        with:
          name: multi-rule-demo-qa
          path: dist/multi-rule-qa/
          if-no-files-found: ignore
          retention-days: 14

      - name: Check current branch head
        id: head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'JS'
          import { appendFileSync } from 'node:fs';
          const { GITHUB_API_URL, GITHUB_REPOSITORY, GITHUB_REF_NAME, GITHUB_SHA, GH_TOKEN, GITHUB_OUTPUT } = process.env;
          const response = await fetch(`${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/git/ref/heads/${encodeURIComponent(GITHUB_REF_NAME)}`, {
            headers: { Authorization: `Bearer ${GH_TOKEN}`, Accept: 'application/vnd.github+json' },
          });
          if (response.status === 404) {
            appendFileSync(GITHUB_OUTPUT, 'current=false\n');
            console.log('Branch no longer exists; skipping deployment.');
          } else {
            if (!response.ok) throw new Error(`Cannot verify branch head: HTTP ${response.status}`);
            const ref = await response.json();
            const current = ref.object.sha === GITHUB_SHA;
            appendFileSync(GITHUB_OUTPUT, `current=${current}\n`);
            if (!current) console.log('A newer commit exists; skipping this deployment.');
          }
          JS

      - name: Deploy branch demo
        if: steps.head.outputs.current == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo '::error::Set the CLOUDFLARE_API_TOKEN repository secret and CLOUDFLARE_ACCOUNT_ID repository variable. See docs/demo-environment.md.'
            exit 1
          fi
          npm run demo:deploy

      - name: Record deployment URL
        if: steps.head.outputs.current == 'true'
        run: |
          node --input-type=module <<'JS'
          import { appendFileSync, readFileSync } from 'node:fs';
          const { url, commit, workerName } = JSON.parse(readFileSync('dist/demo-meta.json', 'utf8'));
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, `### Branch demo deployed\n\n[Open demo](${url}) (Cloudflare Access login required)\n\nCommit: \`${commit}\`\n\nWorker: \`${workerName}\`\n\nVersion ID: see the deploy step log.\n`);
          JS
