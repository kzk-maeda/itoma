name: Cleanup demo

on:
  delete:
  workflow_dispatch:
    inputs:
      branch:
        description: Deleted branch name
        required: true
        type: string
      dry_run:
        description: Only inspect resources without deleting them
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  cleanup:
    if: >-
      (github.event_name == 'delete' && github.event.ref_type == 'branch' &&
       github.event.ref != 'main' && github.event.ref != github.event.repository.default_branch) ||
      (github.event_name == 'workflow_dispatch' && inputs.branch != 'main' &&
       inputs.branch != github.event.repository.default_branch)
    # Must match deployment, even though delete events point at the default ref.
    concurrency:
      group: deploy-demo-refs/heads/${{ github.event_name == 'delete' && github.event.ref || inputs.branch }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      # Built-in Node modules only: no dependency installation or branch code.
      - name: Cleanup deleted branch demo
        env:
          DEMO_BRANCH: ${{ github.event_name == 'delete' && github.event.ref || inputs.branch }}
          DEMO_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          DEMO_CLEANUP_APPLY: ${{ github.event_name == 'delete' || !inputs.dry_run }}
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/cleanup-demo.mjs
