name: Service site

on:
  pull_request:
    paths: ['site/**', '.github/workflows/deploy-site.yml']
  push:
    branches: [main]
    paths:
      - 'site/src/**'
      - 'site/scripts/**'
      - 'site/package.json'
      - 'site/package-lock.json'
      - 'site/wrangler.jsonc'
      - '.github/workflows/deploy-site.yml'

permissions:
  contents: read

concurrency:
  group: service-site-${{ github.event_name == 'push' && 'production' || github.ref }}
  cancel-in-progress: false

jobs:
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run check:deploy
        env:
          WRANGLER_SEND_METRICS: 'false'
      - name: Check local Cloudflare routes and headers
        env:
          WRANGLER_SEND_METRICS: 'false'
        run: |
          npx wrangler dev --ip 127.0.0.1 --port 8788 > /tmp/itoma-site-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          npm run test:http || { cat /tmp/itoma-site-preview.log; exit 1; }
      # Never expose production credentials to pull requests or demo branches.
      - name: Verify current site sources on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'JS'
          import { appendFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const { GITHUB_API_URL, GITHUB_REPOSITORY, GITHUB_SHA, GITHUB_OUTPUT, GH_TOKEN } = process.env;
          const response = await fetch(`${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/git/ref/heads/main`, {
            headers: { Authorization: `Bearer ${GH_TOKEN}`, Accept: 'application/vnd.github+json' },
          });
          if (!response.ok) throw new Error(`Cannot verify main head: ${response.status}`);
          const ref = await response.json();
          const treeResponse = await fetch(`${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/git/trees/${ref.object.sha}?recursive=1`, {
            headers: { Authorization: `Bearer ${GH_TOKEN}`, Accept: 'application/vnd.github+json' },
          });
          if (!treeResponse.ok) throw new Error(`Cannot verify site tree: ${treeResponse.status}`);
          const tree = await treeResponse.json();
          if (tree.truncated) throw new Error('Cannot safely compare truncated tree');
          const relevant = path => /^site\/(src\/|scripts\/|package(?:-lock)?\.json$|wrangler\.jsonc$)/.test(path) || path === '.github/workflows/deploy-site.yml';
          const latest = tree.tree.filter(item => item.type === 'blob' && relevant(item.path)).map(item => `${item.path} ${item.sha}`).sort();
          const localTree = execFileSync('git', ['ls-tree', '-r', '--full-tree', GITHUB_SHA], { encoding: 'utf8' });
          const local = localTree.trim().split('\n').map(line => {
            const [metadata, path] = line.split('\t');
            return { path, sha: metadata.split(' ')[2] };
          }).filter(item => relevant(item.path)).map(item => `${item.path} ${item.sha}`).sort();
          const current = JSON.stringify(latest) === JSON.stringify(local);
          appendFileSync(GITHUB_OUTPUT, `current=${current}\n`);
          if (!current) console.log('Newer site changes exist; skipping this deployment.');
          JS
      # The first private bootstrap is documented in site/README.md. This public HTTP
      # precondition needs no Access admin token and cannot read the site through Access.
      - name: Require private prelaunch Access
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.head.outputs.current == 'true'
        run: npm run check:access
      - name: Deploy itoma.app (Access protected)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.head.outputs.current == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo '::error::Configure CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID. See site/README.md.'
            exit 1
          fi
          npm run deploy
          printf '## Service site deployed (owner-only Access)\n\nhttps://itoma.app/\n\nCommit: `%s`\n' "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
