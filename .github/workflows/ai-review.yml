name: AI code review

on:
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: PR number to review (run this workflow from main)
        required: true
        type: string
  pull_request_target:
    branches: [main]
    types: [labeled, synchronize, reopened, ready_for_review]

permissions: {}

concurrency:
  group: ai-review-${{ github.event.pull_request.number || inputs.pull_request_number }}
  cancel-in-progress: true

env:
  AI_REVIEW_PR_NUMBER: ${{ github.event.pull_request.number || inputs.pull_request_number }}
  AI_REVIEW_EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
  AI_REVIEW_REQUIRE_LABEL: ${{ github.event_name != 'workflow_dispatch' }}
  AI_REVIEW_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}

jobs:
  review:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       !github.event.pull_request.draft &&
       contains(github.event.pull_request.labels.*.name, 'ai-review') &&
       (github.event.action != 'labeled' || github.event.label.name == 'ai-review'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      checks: read
    outputs:
      artifact_id: ${{ steps.evidence.outputs.artifact-id }}
    steps:
      # Pin code to the trusted workflow revision; PR event base.sha can be stale.
      # PR files are read as data via GitHub APIs; never check out or execute the PR.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Review PR using OpenAI Responses API
        run: node scripts/ai-review.mjs review
        env:
          GH_TOKEN: ${{ github.token }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_REVIEW_MODEL: ${{ vars.OPENAI_REVIEW_MODEL || 'gpt-5.4' }}
      - name: Save structured review evidence
        id: evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ai-review-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/ai-review/
          retention-days: 14
          if-no-files-found: warn

  publish:
    needs: review
    if: ${{ always() && !cancelled() && needs.review.outputs.artifact_id != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.review.outputs.artifact_id }}
          path: artifacts/ai-review/
      - name: Update PR review comment if the reviewed revision is still current
        run: node scripts/ai-review.mjs publish
        env:
          GH_TOKEN: ${{ github.token }}
