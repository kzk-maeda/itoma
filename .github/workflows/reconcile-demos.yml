name: Reconcile demos

on:
  schedule:
    - cron: '43 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Only inspect orphaned demos without deleting them
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  reconcile:
    concurrency:
      group: itoma-demo-resource-mutations
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Credentials only execute default-branch code, never a discovered demo ref.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Reconcile orphaned demo Workers and routes
        env:
          DEMO_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          DEMO_CLEANUP_APPLY: ${{ github.event_name == 'schedule' || !inputs.dry_run }}
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/reconcile-demos.mjs
