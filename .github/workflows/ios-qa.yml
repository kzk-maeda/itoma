name: iOS Simulator QA

on:
  workflow_dispatch:
    inputs:
      commit:
        description: Full 40-character source commit SHA
        required: true
        type: string
  pull_request:
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: ios-qa-${{ github.event.pull_request.number || inputs.commit }}
  cancel-in-progress: false

jobs:
  simulator:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.label.name == 'ios-qa' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: macos-26
    timeout-minutes: 50
    env:
      ITOMA_QA_COMMIT: ${{ github.event.pull_request.head.sha || inputs.commit }}
      EXPO_PUBLIC_BUILD_SHA: ${{ github.event.pull_request.head.sha || inputs.commit }}
      EXPO_PUBLIC_NATIVE_SMOKE: '1'
      ITOMA_DEMO_BUILD: '0'
      CI: '1'
    steps:
      - name: Validate immutable target
        shell: bash
        run: |
          [[ ${#ITOMA_QA_COMMIT} -eq 40 && "$ITOMA_QA_COMMIT" =~ ^[0-9a-f]{40}$ ]]
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.ITOMA_QA_COMMIT }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run test:ios-tools
      - name: Build and run unsigned native bridge smoke
        id: qa
        env:
          ITOMA_IOS_QA_OUTPUT: ${{ runner.temp }}/itoma-ios-qa
        run: node scripts/ios-qa.mjs
      - name: Save logs, source provenance and Simulator image
        if: always() && steps.qa.outputs.artifact_dir != ''
        uses: actions/upload-artifact@v7
        with:
          name: ios-qa-${{ env.ITOMA_QA_COMMIT }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            ${{ steps.qa.outputs.artifact_dir }}/result.json
            ${{ steps.qa.outputs.artifact_dir }}/*.log
            ${{ steps.qa.outputs.artifact_dir }}/home.png
