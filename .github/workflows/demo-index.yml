name: Update demo index

on:
  workflow_dispatch:
  workflow_run:
    workflows: [Deploy demo, Cleanup demo]
    types: [completed]
  schedule:
    - cron: '*/15 * * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/*demo-index*'
      - 'scripts/lib/demo-index.mjs'
      - 'scripts/lib/demo-target.mjs'
      - 'wrangler.demo-index.jsonc'
      - '.github/workflows/demo-index.yml'

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: demo-environment-index
  cancel-in-progress: false

jobs:
  update:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Never execute the triggering demo branch with index credentials.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: node --test tests/demo-index.test.mjs
      - name: Collect deployed environments and publish index
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WRANGLER_SEND_METRICS: 'false'
        run: |
          node scripts/build-demo-index.mjs
          npx --no-install wrangler deploy --config wrangler.demo-index.jsonc
          echo 'Demo index updated: https://itoma-demo.kzk-maeda.com/ (Access login required)' >> "$GITHUB_STEP_SUMMARY"
