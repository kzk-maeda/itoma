version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 3
    versioning-strategy: increase-if-necessary
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # Expo owns these versions. Update them together with expo install.
      # SemVer update-types leave security updates available for separate review.
      - dependency-name: "@expo/*"
        update-types: ["version-update:semver-minor", "version-update:semver-patch"]
      - dependency-name: expo
        update-types: ["version-update:semver-minor", "version-update:semver-patch"]
      - dependency-name: "expo-*"
        update-types: ["version-update:semver-minor", "version-update:semver-patch"]
      - dependency-name: react
        update-types: ["version-update:semver-minor", "version-update:semver-patch"]
      - dependency-name: react-dom
        update-types: ["version-update:semver-minor", "version-update:semver-patch"]
      - dependency-name: react-native
        update-types: ["version-update:semver-minor", "version-update:semver-patch"]
      - dependency-name: "react-native-*"
        update-types: ["version-update:semver-minor", "version-update:semver-patch"]
      - dependency-name: "@react-native/*"
        update-types: ["version-update:semver-minor", "version-update:semver-patch"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-minor", "version-update:semver-patch"]
      - dependency-name: "@types/react-native"
        update-types: ["version-update:semver-minor", "version-update:semver-patch"]
      - dependency-name: eslint-config-expo
        update-types: ["version-update:semver-minor", "version-update:semver-patch"]
      - dependency-name: jest-expo
        update-types: ["version-update:semver-minor", "version-update:semver-patch"]
      # The current packager/deployer reads Build Output v0. Migrate it before v1.
      # Unlike update-types, these version bounds also constrain security updates.
      - dependency-name: cf
        versions: [">=1.0.0-rc.0"]
      - dependency-name: wrangler
        versions: [">=4.163.0"]
    groups:
      cloudflare-toolchain:
        # Do not filter update-types: cf uses prereleases that must join this group.
        # A single available update is possible; quality CI validates the actual pair.
        patterns: [cf, wrangler]
      other-dependencies:
        patterns: ["*"]
        exclude-patterns: [cf, wrangler]
        update-types: [minor, patch]
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 2
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: docker
    directory: /.github/docker
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 1
    ignore:
      - dependency-name: swift
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: chore
      include: scope
